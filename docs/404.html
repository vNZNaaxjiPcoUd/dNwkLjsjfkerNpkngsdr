<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon192.png">
    <link rel="apple-touch-icon" href="./favicon192.png">
  <meta property="og:title" content="文章">
  <meta property="og:description" content="有趣的資訊。">
  <meta property="og:image" content="https://d.jwint.net/GoodLuck.jpeg">
  <meta property="og:url" content="https://d.jwint.net/">
  <meta property="og:type" content="website">

    <!-- 引入 CryptoJS 用於前端計算 MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- 引入 Marked.js 用於解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* 基礎版面設定：黑底白字，支援手機滿版且可上下滾動 */
        body {
            margin: 0;
            padding: 20px;
            background-color: #000; /* 黑底 */
            color: #fff; /* 白字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            box-sizing: border-box;
            min-height: 100vh;
            word-wrap: break-word;
        }
        
        #content {
            max-width: 3000px;
            margin: 0 auto;
        }

        /* 針對 Markdown 常見元素的暗色系樣式優化 */
        a { color: #4DA8DA; text-decoration: none; }
        a:hover { text-decoration: underline; }
        pre, code {
            background-color: #222;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }
        pre {
            padding: 15px;
            overflow-x: auto; /* 程式碼過長時允許橫向滾動 */
        }
        img {
            max-width: 100%;
            height: auto;
        }
        blockquote {
            border-left: 4px solid #555;
            margin-left: 0;
            padding-left: 15px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div id="appInfo" style="background-color: black; color: black; display: none;">
        <h1 id="youtube-的另外一面">文章分享</h1>
        <ul>
        <li>有趣文章。</li>
        <li>與君共享。</li>
        </ul>
        <h3 id="太方便了！">太方便了！</h3>     
    </div>    
    <div id="content"></div>

    <script src="doc.js"></script>
</body>
</html>
